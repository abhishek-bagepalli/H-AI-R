<!-- templates/templates.html -->
{% extends "index.html" %}

{% block content %}
<div class="container mt-4 templates-page">
    <h1 class="mb-4">Categories and Templates</h1>

    <form action="/add" method="post" class="mb-4">
        <div class="row g-3 align-items-center">
            <div class="col-md-8">
                <input type="text" name="category" placeholder="New category name" required class="form-control">
            </div>
            <div class="col-md-4">
                <button type="submit" class="btn btn-primary w-100">Add Category</button>
            </div>
        </div>
    </form>

    {% for category, fields in templates.items() %}
    <div class="card mb-3">
        <div class="card-header d-flex justify-content-between align-items-center" style="cursor: pointer;" onclick="toggleCategory(this)">
            <h5 class="mb-0">{{ category.replace("_", " ").title() }}</h5>
            <span class="arrow">▼</span>
        </div>
        <div class="card-body">
            <form action="/update/{{ category }}" method="post">
                {% for field, value in fields.items() %}
                <div class="mb-3">
                    <label class="form-label">{{ field }}:</label>
                    <textarea name="{{ field }}" class="form-control" rows="3">{{ value }}</textarea>
                </div>
                {% endfor %}
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Update Category</button>
                </div>
            </form>
            <form action="/delete/{{ category }}" method="post" class="mt-2" onsubmit="return confirm('Are you sure you want to delete this category?');">
                <button type="submit" class="btn btn-danger">Delete Category</button>
            </form>
        </div>
    </div>
    {% endfor %}
</div>

<style>
.card {
    overflow: hidden;
}
.card-body {
    transition: max-height 0.3s ease-out;
    max-height: 0;
    padding: 0;
}
.card.open .card-body {
    max-height: 1000px;
    padding: 1.25rem;
}
</style>

<script>
function toggleCategory(header) {
    const card = header.parentElement;
    card.classList.toggle('open');
    
    const arrow = header.querySelector('.arrow');
    if (card.classList.contains('open')) {
        arrow.textContent = '▲';
    } else {
        arrow.textContent = '▼';
    }
}
</script>
{% endblock %}

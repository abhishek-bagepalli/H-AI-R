<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>H (ai)  R</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Template-specific styles */
    .templates-page .card {
      overflow: hidden;
    }
    .templates-page .card-body {
      transition: all 0.3s ease-out;
      max-height: 0;
      opacity: 0;
      padding: 1.25rem;
      margin: 0;
    }
    .templates-page .card.open .card-body {
      max-height: 1000px;
      opacity: 1;
    }

    /* Home page specific styles */
    .home-page .container {
      text-align: center;
      animation: fadeIn 1.5s ease;
    }

    .home-page .animation {
      height: 80vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .home-page .project-name {
      font-size: 60px;
      font-weight: bold;
      color: #2c3e50;
      letter-spacing: 2px;
    }

    .home-page .project-name span {
      display: inline-block;
      opacity: 0;
      transform: translateY(20px);
      animation: riseIn 1s forwards;
    }

    .home-page .project-name span:nth-child(1) { animation-delay: 0s; }
    .home-page .project-name span:nth-child(2) { animation-delay: 0.4s; }
    .home-page .project-name span:nth-child(3) { animation-delay: 0.8s; }

    .home-page .tagline {
      font-size: 20px;
      color: #555;
      margin-top: 5vh;
      animation: fadeIn 2s ease 1s forwards;
      opacity: 0;
    }

    .home-page .cta-button {
      margin-top: 30px;
      padding: 12px 30px;
      font-size: 16px;
      background-color: #4f46e5;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .home-page .cta-button:hover {
      background-color: #4338ca;
    }

    @keyframes riseIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>

<body>
  {% include '_navbar.html' %}
  
  {% block content %}
  <div class="container home-page">
    <div class="animation">
      <div class="project-name">
        <span>H</span><span>(ai)</span><span>R</span>
      </div>
      <div class="tagline">Your AI-Powered HR Email Assistant</div>
    </div>
  </div>
  {% endblock %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function toggleCategory(header) {
      const card = header.parentElement;
      card.classList.toggle('open');
      
      const arrow = header.querySelector('.arrow');
      if (card.classList.contains('open')) {
        arrow.textContent = '▲';
      } else {
        arrow.textContent = '▼';
      }
    }

    // Auto-hide flash messages after 4 seconds
    setTimeout(() => {
      document.querySelectorAll('.alert').forEach(el => {
        el.style.display = 'none';
      });
    }, 4000);
  </script>
</body>

</html>

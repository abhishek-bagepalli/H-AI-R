<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Manage Response Templates</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <h1>HR Response Templates Manager</h1>

    <h2>Add New Category</h2>
    <form action="/add" method="post" class="form-inline">
      <input type="text" name="category" placeholder="New category name" required>
      <button type="submit">Add Category</button>
    </form>

    <hr>

    {% for category, fields in templates.items() %}
  <div class="category-block">
    <div class="category-header" onclick="toggleCategory(this)">
      {{ category.replace("_", " ").title() }}
      <span class="arrow">▼</span>
    </div>
    <div class="category-content">
      <form action="/update/{{ category }}" method="post">
        {% for field, value in fields.items() %}
          <label>{{ field }}:</label><br>
          <textarea name="{{ field }}" rows="2" cols="80">{{ value }}</textarea><br><br>
        {% endfor %}
        <button type="submit">Update</button>
      </form>
    </div>
  </div>
{% endfor %}
  </div>
</body>
</html>
<script>
  function toggleCategory(header) {
    const block = header.parentElement;
    block.classList.toggle('open');
  
    // Toggle arrow direction
    const arrow = header.querySelector('.arrow');
    if (block.classList.contains('open')) {
      arrow.textContent = "▲";
    } else {
      arrow.textContent = "▼";
    }
  }
  </script>
